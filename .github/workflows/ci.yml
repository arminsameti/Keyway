name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: make smoke
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path native
