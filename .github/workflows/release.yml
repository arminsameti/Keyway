name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: Stamp the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $v" -c "Set :CFBundleVersion $v" native/Info.plist
      - run: make app VERSION="$GITHUB_REF_NAME"
      - name: Package
        run: |
          make dmg VERSION="$GITHUB_REF_NAME"
          mv "dist/Keyway-${GITHUB_REF_NAME}.dmg" "Keyway-${GITHUB_REF_NAME}-macOS.dmg"
          ditto -c -k --keepParent dist/Keyway.app "Keyway-${GITHUB_REF_NAME}-macOS.zip"
          shasum -a 256 Keyway-*.dmg Keyway-*.zip > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Keyway-*.dmg Keyway-*.zip SHA256SUMS.txt --generate-notes --title "Keyway $GITHUB_REF_NAME"
