# Clash Meta (mihomo) style config: one entry per supported type, plus edge cases.
mixed-port: 7890
proxies:
  - {name: "🇩🇪 SS 2022", type: ss, server: ss.example.net, port: 8388, cipher: 2022-blake3-aes-128-gcm, password: "c3MyMDIy"}
  - name: VMess WS
    type: vmess
    server: vm.example.net
    port: 443
    uuid: 11111111-1111-1111-1111-111111111111
    alterId: 0
    cipher: auto
    tls: true
    servername: cdn.example.net
    network: ws
    ws-opts: {path: /ws, headers: {Host: cdn.example.net}}
  - name: VLESS Reality
    type: vless
    server: vl.example.net
    port: 443
    uuid: 22222222-2222-2222-2222-222222222222
    flow: xtls-rprx-vision
    tls: true
    servername: www.example.com
    client-fingerprint: chrome
    reality-opts: {public-key: PUBKEY, short-id: ab12}
  - {name: Trojan gRPC, type: trojan, server: tr.example.net, port: 443, password: pw, sni: tr.example.net, network: grpc, grpc-opts: {grpc-service-name: svc}}
  - {name: Trojan HTTP obfs, type: trojan, server: tr2.example.net, port: 80, password: pw, tls: false, network: http, http-opts: {path: [/], headers: {Host: [a.com]}}}
  - {name: SOCKS, type: socks5, server: 10.0.0.1, port: 1080, username: u, password: p}
  - {name: HTTPS proxy, type: http, server: px.example.net, port: 443, username: u, password: p, tls: true, sni: px.example.net}
  - {name: Hy2, type: hysteria2, server: hy.example.net, port: 443, password: pw, sni: hy.example.net, obfs: salamander, obfs-password: ob, up: "50 Mbps", down: 200}
  - {name: Hy1, type: hysteria, server: hy1.example.net, port: 443, auth-str: secret, up: 30, down: 100, obfs: xp, sni: hy1.example.net}
  - {name: TUIC, type: tuic, server: tu.example.net, port: 443, uuid: 33333333-3333-3333-3333-333333333333, password: pw, congestion-controller: bbr, udp-relay-mode: native, reduce-rtt: true, sni: tu.example.net}
  - name: WG
    type: wireguard
    server: wg.example.org
    port: 51820
    ip: 10.7.0.2
    ipv6: fd00::2
    private-key: PRIV
    public-key: PUB
    reserved: [1, 2, 3]
    mtu: 1420
  - {name: AnyTLS, type: anytls, server: at.example.net, port: 443, password: pw, sni: at.example.net, idle-session-timeout: 30}
  - {name: ShadowTLS, type: ss, server: st.example.net, port: 443, cipher: 2022-blake3-aes-128-gcm, password: inner, plugin: shadow-tls, plugin-opts: {host: www.example.com, password: outer, version: 3}}
  - {name: SSH, type: ssh, server: ssh.example.net, port: 22, username: root, private-key: ~/.ssh/id_ed25519}
  - {name: Legacy SSR, type: ssr, server: r.example.net, port: 1, cipher: aes-256-cfb, password: p, protocol: origin, obfs: plain}
  - {name: Snell, type: snell, server: s.example.net, port: 1, psk: x}
  - {name: Obfs plugin, type: ss, server: o.example.net, port: 1, cipher: aes-128-gcm, password: p, plugin: obfs}
  - {name: Broken, type: vmess, server: b.example.net, port: 443}
  - {name: TUIC v4, type: tuic, server: t4.example.net, port: 443, token: tok}
proxy-groups:
  - {name: Auto, type: url-test, proxies: [VMess WS]}
